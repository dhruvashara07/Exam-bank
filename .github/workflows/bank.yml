name: Question bank

# Runs by itself whenever something is pushed (e.g. PDFs uploaded from the GitHub app):
#   1. PDFs in inbox/ (any Cambridge name, e.g. 0625_s25_qp_41.pdf) are filed into raw/ and stored in
#      GitHub Releases (raw/manifest.json lists them; the PDFs themselves are not kept in git)
#   2. those papers are processed into bank/ and committed
#   3. new/changed SVGs go to Cloudinary (folder question_bank/)
#   4. papers Claude has approved (review/approvals/) are synced to MongoDB (database question_bank).
#      New or re-cut papers wait as 'pending' until the daily Claude check approves them.
# Can also be started by hand: Actions -> Question bank -> Run workflow.
#
# Keys are NOT written in this file. They are GitHub Secrets
# (Settings -> Secrets and variables -> Actions), read below by name:
#   MONGO_URI               mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/?retryWrites=true&w=majority
#   CLOUDINARY_CLOUD_NAME   e.g. dv7rn244s
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
on:
  push:
    branches: [main]
    paths: ['inbox/**', 'bank/**', 'review/approvals/**']
  workflow_dispatch:
    inputs:
      all:
        description: 'Upload every SVG again (first run, or after a full re-run)'
        type: boolean
        default: false
      reprocess:
        description: 'Re-process every paper (after a pipeline change)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bank
  cancel-in-progress: false

jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGO_DB: question_bank
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: File inbox PDFs, store them in Releases, find papers to process
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
          REPROCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.reprocess || false }}
        run: |
          python3 pipeline/inbox.py > todo.txt
          python3 pipeline/raw_store.py upload
          if [ -n "$(git status --porcelain raw/manifest.json)" ]; then   # keep the list of stored PDFs in git
            git config user.name "exam-bank bot"; git config user.email "actions@users.noreply.github.com"
            cp todo.txt /tmp/todo.txt
            SKIP_WAIT=1 pipeline/push.sh "Store original PDFs in GitHub Releases (raw/manifest.json)"
            cp /tmp/todo.txt todo.txt
          fi
          sort -u todo.txt -o todo.txt
          if [ "$REPROCESS" = "true" ]; then echo "ALL" > todo.txt; fi
          echo "papers: $(tr '\n' ' ' < todo.txt)"
          echo "count=$(grep -c . todo.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Process papers
        if: steps.todo.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qx ALL todo.txt; then python3 pipeline/raw_store.py fetch; else python3 pipeline/raw_store.py fetch $(cat todo.txt); fi
          if grep -qx ALL todo.txt; then python3 pipeline/run.py; else python3 pipeline/run.py $(cat todo.txt); fi
          if grep -qx ALL todo.txt; then python3 pipeline/checks.py; else python3 pipeline/checks.py $(cat todo.txt); fi
          if ! grep -qx ALL todo.txt; then python3 pipeline/batch.py new "Upload $(date -u +%Y-%m-%d) (main inbox)" $(cat todo.txt); fi
          git config user.name "exam-bank bot"
          git config user.email "actions@users.noreply.github.com"
          SKIP_WAIT=1 pipeline/push.sh "Process papers: $(tr '\n' ' ' < todo.txt)"

      - name: Upload SVGs to Cloudinary
        env:
          CLOUDINARY_MINUTES: '240'      # stop uploading after 4 h; the next run continues where it stopped
        run: python3 pipeline/sync_cloudinary.py

      - name: Sync to MongoDB
        if: ${{ !cancelled() }}
        run: |
          python3 pipeline/sync_mongo.py
          if [ -n "$(git status --porcelain review/published.json)" ]; then   # tracker: 'published'
            git config user.name "exam-bank bot"; git config user.email "actions@users.noreply.github.com"
            SKIP_WAIT=1 pipeline/push.sh "Published to MongoDB: $(python3 -c 'import json;print(len(json.load(open("review/published.json"))))') papers"
          fi

      - name: Papers waiting for Claude's check
        run: python3 pipeline/approve.py --pending
